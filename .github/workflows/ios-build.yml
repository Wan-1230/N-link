name: iOS Build

# 在 macOS runner 上编译 iOS 端源码。
#
# 存在的理由：开发机是 Windows，装不了 Xcode，也没有可连的 Mac。
# 这份配置让「编译验证」不必等真机/Mac 到手——push 一次就能拿到
# 真实的 Swift 编译错误，而不是靠人工核对猜。
#
# 免费额度：公开仓库的 macOS runner 不计费（私有仓库 10 倍速率计费）。
# 单次运行约 2-4 分钟（pod 缓存命中时）。
#
# 手动触发：仓库页 Actions → iOS Build → Run workflow。

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
  workflow_dispatch:

jobs:
  build:
    # macos-14 = Apple Silicon + Xcode 15.x，对应 Package.swift 里的 iOS 16 平台。
    # 不用 macos-13（Intel、Xcode 15.0 早期版本）：Swift 5.9 的
    # `.enableUpcomingFeature` 需要较新的 toolchain。
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | head -20

      - name: Resolve package
        working-directory: ios
        run: |
          swift package resolve || true
          swift package describe

      - name: Build (iOS Simulator SDK)
        working-directory: ios
        run: |
          set -o pipefail
          swift build \
            -Xswiftc -sdk -Xswiftc "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -Xswiftc -target -Xswiftc "arm64-apple-ios16.0-simulator" \
            2>&1 | tee /tmp/build.log

      # 编译失败时把错误行单独标出来，方便直接读结论。
      # grep 不命中不算失败（exit 0），只有真的编译失败才会在上一 step 挂掉。
      - name: Summarize errors
        if: failure()
        run: |
          echo "=== 编译错误摘要 ==="
          grep -E "error:" /tmp/build.log | sed 's|'"$PWD"'/||' | head -60 || echo "（无 error: 行，可能是链接/配置阶段失败）"

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: /tmp/build.log
          retention-days: 14
          if-no-files-found: ignore
