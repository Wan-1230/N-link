name: iOS Build

# 在 macOS runner 上编译 iOS 端源码。
#
# 存在的理由：开发机是 Windows，装不了 Xcode，也没有可连的 Mac。
# 这份配置让「编译验证」不必等真机/Mac 到手——push 一次就能拿到
# 真实的 Swift 编译错误，而不是靠人工核对猜。
#
# 免费额度：公开仓库的 macOS runner 不计费（私有仓库 10 倍速率计费）。
#
# 手动触发：仓库页 Actions → iOS Build → Run workflow。

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
  workflow_dispatch:

jobs:
  build:
    # macos-14 = Apple Silicon + Xcode 15.x，对应 Package.swift 里的 iOS 16 平台。
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "--- available simulators ---"
          xcrun simctl list devices available | grep -E "iPhone|-- iOS " | head -14

      - name: Resolve package
        working-directory: ios
        run: |
          swift package resolve || true
          swift package describe

      # 用 xcodebuild 而不是 `swift build -Xswiftc -target ...`：
      # 后者手动指定三元组时不会自动带上 -sysroot 与框架搜索路径，
      # 于是 `import UIKit` 直接报 "cannot load underlying module for 'UIKit'"。
      # xcodebuild 通过 destination 会自动配齐 SDK、sysroot 与模块缓存。
      # SwiftPM 包在 Xcode 15 下可直接作为 scheme 构建（无需先生成 .xcodeproj）。
      - name: Build for iOS Simulator
        id: build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme NLink \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -configuration Debug \
            -derivedDataPath /tmp/dd \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/build.log | tail -100

      # 失败时先分辨是哪一类失败：scheme/目的地解析、还是真的编译错误。
      # 前者说明构建入口没配好，后者才是源码问题。这两类不能混着看。
      - name: Summarize errors
        if: failure()
        run: |
          echo "=== 失败分类 ==="
          if grep -q "does not contain a scheme named" /tmp/build.log; then
            echo "类别：构建入口问题（找不到 scheme NLink）"
            echo "--- 实际可用的 scheme ---"
            xcodebuild -list -json 2>/dev/null || true
            swift package describe 2>/dev/null || true
          elif grep -qE "^.*error:" /tmp/build.log; then
            echo "类别：源码编译错误"
            grep -E "error:" /tmp/build.log \
              | sed -E 's|/Users/runner/work/[^/]+/[^/]+/ios/||' \
              | grep -v "^<unknown>" \
              | sort -u | head -60
          else
            echo "类别：链接/配置阶段失败（无 error: 行）"
            tail -50 /tmp/build.log
          fi

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: /tmp/build.log
          retention-days: 14
          if-no-files-found: ignore
