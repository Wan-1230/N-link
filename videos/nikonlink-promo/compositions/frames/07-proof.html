<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <style>
    @font-face { font-family: "Inter Tight"; font-weight: 600; font-style: normal; font-display: block; src: url("assets/fonts/InterTight-SemiBold.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-style: normal; font-display: block; src: url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2"); }
    @font-face { font-family: "Noto Sans SC"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/NotoSansSC-Regular.woff2") format("woff2"); }
    @font-face { font-family: "Noto Sans SC"; font-weight: 500; font-style: normal; font-display: block; src: url("assets/fonts/NotoSansSC-Medium.woff2") format("woff2"); }
    @font-face { font-family: "Noto Sans SC"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/NotoSansSC-Bold.woff2") format("woff2"); }

    /* frame root — styled by #root, never by a class on the composition element */
    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
      background: none;
    }
    #root * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── 2x2 stat grid · centered in the top 83% (≤ 896px) ───────────────── */
    .c07-grid {
      position: absolute; left: 50%; top: 430px;
      width: 1240px; height: 584px;
      transform: translate(-50%, -50%);
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 36px;
    }
    .c07-card {
      background: #FFFFFF;
      border: 1px solid #E4E4E4;
      border-radius: 12px;
      padding: 42px 56px;
      display: flex; flex-direction: column; justify-content: center; gap: 18px;
    }
    .c07-label {
      font-family: "Noto Sans SC", sans-serif;
      font-size: 25px; font-weight: 500; color: #8C8C8C;
      letter-spacing: 0.04em;
    }
    .c07-value {
      display: flex; align-items: baseline;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500; font-size: 100px; line-height: 1;
      color: #000000; letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }
    .c07-unit {
      font-family: "IBM Plex Mono", monospace;
      font-size: 30px; font-weight: 500; color: #525252;
      letter-spacing: 0.02em; margin-left: 16px;
    }

    /* ── inline caption pill · bottom ~12% band (keep-out below 896px) ────── */
    .c07-capband {
      position: absolute; left: 0; right: 0; top: 950px; height: 130px;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .c07-cap {
      position: absolute;
      background: #000000; border-radius: 999px;
      padding: 16px 44px;
      font-family: "Noto Sans SC", sans-serif;
      font-size: 30px; font-weight: 500; color: #FFFFFF;
      letter-spacing: 0.02em; white-space: nowrap;
    }
  </style>

  <div id="root" data-composition-id="07-proof" data-width="1920" data-height="1080" data-duration="7.5">
    <!-- track 0 · full-bleed white ground — rides on a clip layer, never on #root -->
    <div class="clip" data-start="0" data-duration="7.5" data-track-index="0"
         style="position: absolute; inset: 0; background: #FFFFFF;"></div>

    <!-- track 1 · the 2x2 proof grid -->
    <div class="clip" data-start="0" data-duration="7.5" data-track-index="1"
         style="position: absolute; inset: 0;">
      <div id="c07-grid" class="c07-grid">

        <div id="c07-card1" class="c07-card" style="opacity: 0;">
          <div class="c07-label">自动重连</div>
          <div class="c07-value"><span id="c07-n1">0</span><span class="c07-unit">&lt;3s</span></div>
        </div>

        <div id="c07-card2" class="c07-card" style="opacity: 0;">
          <div class="c07-label">后台存活</div>
          <div class="c07-value"><span id="c07-n2">0</span><span class="c07-unit">%+</span></div>
        </div>

        <div id="c07-card3" class="c07-card" style="opacity: 0;">
          <div class="c07-label">传输</div>
          <div class="c07-value"><span id="c07-n3">0</span><span class="c07-unit">MB/s</span></div>
        </div>

        <div id="c07-card4" class="c07-card" style="opacity: 0;">
          <div class="c07-label">Live View</div>
          <div class="c07-value"><span id="c07-n4">0</span><span class="c07-unit">ms</span></div>
        </div>

      </div>
    </div>

    <!-- track 2 · inline captions (own render of the 字幕 cues) -->
    <div class="clip" data-start="0" data-duration="7.5" data-track-index="2"
         style="position: absolute; inset: 0;" aria-hidden="true">
      <div class="c07-capband">
        <div id="c07-cap1" class="c07-cap" style="opacity: 0;">断联？3 秒内自动重连。</div>
        <div id="c07-cap2" class="c07-cap" style="opacity: 0;">后台存活 99% 以上——</div>
        <div id="c07-cap3" class="c07-cap" style="opacity: 0;">你只管拍，剩下的交给它。</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });

      var grid  = $("c07-grid");
      var cards = [$("c07-card1"), $("c07-card2"), $("c07-card3"), $("c07-card4")];
      var nums  = [$("c07-n1"), $("c07-n2"), $("c07-n3"), $("c07-n4")];
      var caps  = [$("c07-cap1"), $("c07-cap2"), $("c07-cap3")];

      /* ══ Scene 1 (0.0–2.5s) · cards spring-pop in, 150ms stagger ══════════ */
      cards.forEach(function (card, i) {
        tl.fromTo(card,
          { opacity: 0, scale: 0.86, y: 26, xPercent: 0, yPercent: 0 },
          { opacity: 1, scale: 1, y: 0, xPercent: 0, yPercent: 0,
            duration: 0.65, ease: "back.out(2.2)" },
          0.2 + i * 0.15);
      });

      /* card 1 counter rides cue 1 · 0 → 3 */
      var c1 = { v: 0 };
      tl.fromTo(c1, { v: 0 }, {
        v: 3, duration: 1.1, ease: "power2.out",
        onUpdate: function () { nums[0].textContent = String(Math.round(c1.v)); }
      }, 0.55);

      /* ══ Scene 2 (2.5–5.0s) · remaining readings land on the cue beats ═══ */
      var c2 = { v: 0 };
      tl.fromTo(c2, { v: 0 }, {
        v: 99, duration: 1.0, ease: "power2.out",
        onUpdate: function () { nums[1].textContent = String(Math.round(c2.v)); }
      }, 2.6);

      var c3 = { v: 0 };
      tl.fromTo(c3, { v: 0 }, {
        v: 10.4, duration: 1.0, ease: "power2.out",
        onUpdate: function () { nums[2].textContent = c3.v.toFixed(1); }
      }, 3.55);

      var c4 = { v: 0 };
      tl.fromTo(c4, { v: 0 }, {
        v: 200, duration: 1.0, ease: "power2.out",
        onUpdate: function () { nums[3].textContent = String(Math.round(c4.v)); }
      }, 4.5);

      /* ══ Scene 3 (5.0–7.0s) · whole grid eases back ~2%, then holds ══════ */
      tl.fromTo(grid,
        { scale: 1, xPercent: -50, yPercent: -50 },
        { scale: 0.98, xPercent: -50, yPercent: -50,
          duration: 0.9, ease: "power2.inOut" },
        5.0);

      /* ══ inline captions · switch on the 字幕 cue times ═══════════════════ */
      /* cue 1 · 0–2.5s */
      tl.fromTo(caps[0], { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.05);
      tl.to(caps[0], { opacity: 0, duration: 0.18, ease: "power1.in" }, 2.32);
      /* cue 2 · 2.5–5s */
      tl.fromTo(caps[1], { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 2.5);
      tl.to(caps[1], { opacity: 0, duration: 0.18, ease: "power1.in" }, 4.82);
      /* cue 3 · 5–7s · lands with the zoom-out settle */
      tl.fromTo(caps[2], { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 5.0);

      /* hold the landed state to the cut */
      tl.to({}, { duration: 0.01 }, 6.99);

      window.__timelines = window.__timelines || {};
      window.__timelines["07-proof"] = tl;
    })();
  </script>
</template>
