    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ————— spring-pop (rule recipe): scale 0 → 1, opacity 0 → 1, power3.out —

         Numeral is the hero — visible by t ≤ 0.5s. Hard cuts are opacity sets (seek-safe),
         never exits: the root transition owns the frame's departure. */

        tl.fromTo(
          numEl,
          { opacity: 0, x: -20 },
          { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" },
          at + 0.05

        tl.fromTo(
          lineEl,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
          at + 0.15
