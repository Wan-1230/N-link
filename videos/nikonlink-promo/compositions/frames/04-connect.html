      tl.to(cursor, { x: 505.5, y: 433, duration: 0.9, ease: "power2.inOut" }, 4.5);

      tl.fromTo(nameFull, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 8.0);

      // 120ms ladder — 电量 / 存储 / 剩余可拍

      tl.to(step1, { opacity: 0.4, duration: 0.4 }, 8.1);
