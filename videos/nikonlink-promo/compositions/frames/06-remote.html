    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });

      var stage   = $("c06-stage");

      var cursor  = $("c06-cursor");
      var tabs    = $("c06-tabs");
      var linkst  = $("c06-linkst");

      var cap1 = $("c06-cap-1"), cap2 = $("c06-cap-2"), cap3 = $("c06-cap-3"), cap4 = $("c06-cap-4");

      // slow macro drift under everything (seek-safe)
      tl.fromTo(stage, { scale: 1.025 }, { scale: 1, duration: 10, ease: "none" }, 0);

      // ── Scene 1 (0.0–3.0) — Tab3 lands: pill, live view, scrim drip ──
      tl.fromTo(phone, { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.05);

      // mode pill drops in + 已连接
      tl.fromTo(tabs, { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(2)" }, 0.35);
      tl.fromTo(linkst, { opacity: 0 }, { opacity: 1, duration: 0.35 }, 0.7);

      // live view fades up · layered-depth ridge settle
      tl.fromTo(live, { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 0.55);
      tl.fromTo(ridgeFar,  { x: -10 }, { x: 0, duration: 1.8, ease: "power2.out" }, 0.6);
      tl.fromTo(ridgeMid,  { x: -18 }, { x: 0, duration: 1.8, ease: "power2.out" }, 0.6);
      tl.fromTo(ridgeNear, { x: -28 }, { x: 0, duration: 1.8, ease: "power2.out" }, 0.6);

      // scrim info bar drips down
      tl.fromTo(scrim, { opacity: 0, y: -44 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.0);

      // parameter strip ladder + shutter
      tl.fromTo(dial1, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.3);
      tl.fromTo(dial2, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.42);
      tl.fromTo(dial3, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.54);
      tl.fromTo(ring,    { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.4)" }, 1.7);
      tl.fromTo(shutter, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.4)" }, 1.7);

      // cursor enters, glides to the right-third focus point (root 481,340 → dot -6)
      tl.fromTo(cursor,
        { x: 1080, y: 720, opacity: 0 },
        { x: 475, y: 334, opacity: 1, duration: 1.55, ease: "power2.inOut" }, 1.7);

      // ── Scene 2 (3.0–5.5) — tap → focus box lands + contracts once ──
      tl.set(cap1, { opacity: 0 }, 3.0);
      tl.fromTo(cap2, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 3.0);

      // press-release recoil — 4% on the cursor
      tl.fromTo(cursor, { scale: 1 }, { scale: 0.96, duration: 0.12, ease: "power2.out" }, 3.42);
      tl.to(cursor, { scale: 1, duration: 0.18, ease: "back.out(3)" }, 3.56);

      // 56px focus box · lands oversized, contracts once to lock
      tl.fromTo(focus,
        { opacity: 0, scale: 1.55 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.2)" }, 3.5);

      // glide down to the ISO dial (ISO up chevron center ≈ root 555,696)
      tl.to(cursor, { x: 549, y: 690, duration: 0.85, ease: "power2.inOut" }, 4.6);

      // ── Scene 3 (5.5–8.0) — ISO flip 400→800 · shutter · flash · 已拍 1 ──
      tl.set(cap2, { opacity: 0 }, 5.5);
      tl.fromTo(cap3, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 5.5);

      // press the up chevron — recoil on cursor + chevron nudge
      tl.fromTo(cursor, { scale: 1 }, { scale: 0.96, duration: 0.12, ease: "power2.out" }, 5.9);
      tl.to(cursor, { scale: 1, duration: 0.18, ease: "back.out(3)" }, 6.04);
      tl.fromTo(isoChev, { y: 0 }, { y: -2, duration: 0.12, ease: "power2.out" }, 5.9);
      tl.to(isoChev, { y: 0, duration: 0.18, ease: "power2.out" }, 6.04);

      // reading flips on the same beat — 400 out, 800 in
      tl.to(iso400, { y: -24, opacity: 0, duration: 0.3, ease: "power2.in" }, 5.98);
      tl.fromTo(iso800, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 5.98);

      // glide to the shutter (center root 420,794)
      tl.to(cursor, { x: 414, y: 788, duration: 0.7, ease: "power2.inOut" }, 6.3);

      // press the shutter — recoil on cursor + button
      tl.fromTo(cursor, { scale: 1 }, { scale: 0.96, duration: 0.12, ease: "power2.out" }, 7.05);
      tl.fromTo(shutter, { scale: 1 }, { scale: 0.94, duration: 0.12, ease: "power2.out" }, 7.05);
      tl.to(cursor, { scale: 1, duration: 0.18, ease: "back.out(3)" }, 7.2);
      tl.to(shutter, { scale: 1, duration: 0.22, ease: "back.out(3)" }, 7.2);

      // 120ms full-white flash over the live area
      tl.fromTo(flash, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 7.12);
      tl.to(flash, { opacity: 0, duration: 0.06, ease: "none" }, 7.18);

      // 已拍 counter +1 bounce
      tl.set(cnt0, { opacity: 0 }, 7.2);
      tl.fromTo(cnt1, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(3)" }, 7.2);

      // cursor drifts off to rest
      tl.to(cursor, { x: 340, y: 700, duration: 0.8, ease: "power2.inOut" }, 7.5);

      // ── Scene 4 (8.0–10.0) — right stage: <200ms spring-pops once, holds ──
      tl.set(cap3, { opacity: 0 }, 8.0);
      tl.fromTo(cap4, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 8.0);

        { opacity: 0, scale: 0.6, y: 30 },
        { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "back.out(1.8)" }, 8.1);
