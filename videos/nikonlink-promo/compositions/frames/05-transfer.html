    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });

      var phone    = $("c05-phone");
      var cursor   = $("c05-cursor");
      var title    = $("c05-title");
      var multi    = $("c05-multi");
      var seg      = $("c05-seg");
      var progress = $("c05-progress");
      var bar      = $("c05-bar");
      var actDl    = $("c05-act-dl");
      var ms0      = $("c05-ms-0");
      var ms1      = $("c05-ms-1");
      var ck0      = $("c05-ck-0");
      var ck1      = $("c05-ck-1");
      var kicker   = $("c05-kicker");
      var readout  = $("c05-readout");
      var num      = $("c05-num");
      var hairline = $("c05-hairline");
      var axis     = $("c05-axis");
      var chips = [$("c05-chip-0"), $("c05-chip-1"), $("c05-chip-2"), $("c05-chip-3")];
      var tiles = [];
      for (var i = 0; i < 9; i++) tiles.push($("c05-t" + i));
      var cap1 = $("c05-cap-1"), cap2 = $("c05-cap-2"), cap3 = $("c05-cap-3");

      // ── Scene 1 (0.0–3.0) — Tab2 lands · chrome drops · grid ladder-fills ──
      tl.fromTo(phone, { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.05);

      tl.fromTo(cap1, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.1);

      // top bar + multi chip + segmented control drop first
      tl.fromTo(title, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.3);
      tl.fromTo(multi, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.38);
      tl.fromTo(seg,   { opacity: 0, y: 12 },  { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.46);

      // category chips stagger in
      for (var c = 0; c < chips.length; c++) {
        tl.fromTo(chips[c], { opacity: 0, y: 10, scale: 0.9 },
          { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.5 + c * 0.08);
      }

      // 9 monochrome tiles — 60ms ladder, spring-pop
      for (var t = 0; t < 9; t++) {
        tl.fromTo(tiles[t], { opacity: 0, scale: 0.8 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 0.85 + t * 0.06);
      }

      // cursor enters from the right, glides to 多选 (center 574,105 → dot origin −6)
      tl.fromTo(cursor,
        { x: 1970, y: 240, opacity: 0 },
        { x: 568, y: 99, opacity: 1, duration: 1.5, ease: "power2.inOut" }, 1.2);

      // ── Scene 2 (3.0–6.0) — press 多选 · checks pop · bar slides up · press 下载 ──
      tl.set(cap1, { opacity: 0 }, 3.0);
      tl.fromTo(cap2, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 3.0);

      // press-release recoil — 4% on cursor + 多选 chip
      tl.fromTo(cursor, { scale: 1 }, { scale: 0.96, duration: 0.12, ease: "power2.out" }, 3.1);
      tl.fromTo(multi, { scale: 1 }, { scale: 0.96, duration: 0.12, ease: "power2.out" }, 3.1);
      tl.to(cursor, { scale: 1, duration: 0.18, ease: "back.out(3)" }, 3.24);
      tl.to(multi, { scale: 1, duration: 0.22, ease: "back.out(3)" }, 3.24);

      // multi-select checks spring-pop on tiles 1 & 5
      tl.fromTo(ms0, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.6)" }, 3.5);
      tl.fromTo(ms1, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.6)" }, 3.64);

      // floating action bar slides up from below
      tl.fromTo(bar, { opacity: 0, y: 90 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.1);

      // cursor glides to 下载 (bar action 1 center 270,761 → dot origin −6)
      tl.to(cursor, { x: 264, y: 755, duration: 0.8, ease: "power2.inOut" }, 4.7);

      // press 下载 — 4% recoil on cursor + action
      tl.fromTo(cursor, { scale: 1 }, { scale: 0.96, duration: 0.12, ease: "power2.out" }, 5.5);
      tl.fromTo(actDl, { scale: 1 }, { scale: 0.96, duration: 0.12, ease: "power2.out" }, 5.5);
      tl.to(cursor, { scale: 1, duration: 0.18, ease: "back.out(3)" }, 5.64);
      tl.to(actDl, { scale: 1, duration: 0.22, ease: "back.out(3)" }, 5.64);

      // ── Scene 3 (6.0–8.5) — progress sweeps · mono readout counts up ──
      tl.set(cap2, { opacity: 0 }, 6.0);
      tl.fromTo(cap3, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 6.0);

      // 3px ink progress bar 0→100% (2.2s, linear→power2)
      tl.fromTo(progress, { scaleX: 0 }, { scaleX: 1, duration: 2.2, ease: "power2.inOut" }, 6.0);

      // right stage · kicker + readout + hairline
      tl.fromTo(kicker, { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 5.7);
      tl.fromTo(readout, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.85);
      tl.fromTo(axis, { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.1);

      // count-up 0.0 → 10.4 MB/s, synced to the sweep
      var cnt = { v: 0 };
      tl.to(cnt, {
        v: 10.4, duration: 2.2, ease: "power2.inOut",
        onUpdate: function () { num.textContent = cnt.v.toFixed(1); }
      }, 6.0);

      tl.fromTo(hairline, { scaleX: 0 }, { scaleX: 1, duration: 2.2, ease: "power2.inOut" }, 6.0);

      // cursor drifts off toward the readout
      tl.to(cursor, { x: 980, y: 470, duration: 1.2, ease: "power2.inOut" }, 6.3);
      tl.to(cursor, { opacity: 0, duration: 0.3 }, 7.5);

      // ── Scene 4 (8.5–10.0) — corner checks flip · bar recesses · settle ──
      tl.fromTo(ck0, { opacity: 0, rotationY: -90 }, { opacity: 1, rotationY: 0, duration: 0.45, ease: "back.out(2)" }, 8.55);
      tl.fromTo(ck1, { opacity: 0, rotationY: -90 }, { opacity: 1, rotationY: 0, duration: 0.45, ease: "back.out(2)" }, 8.7);

      // floating bar slides back down
      tl.to(bar, { y: 90, opacity: 0, duration: 0.45, ease: "power2.in" }, 8.75);

      // hold the landed full grid to the cut
      tl.to({}, { duration: 0.01 }, 9.99);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-transfer"] = tl;
    })();
  </script>
